<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signalement Disponibilité Produits</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Styles personnalisés -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <h1>🛒 Disponibilité en Direct</h1>
    <p>Signalez et trouvez les produits disponibles dans vos commerces de proximité</p>
  </header>

  <main class="main-container">
    
    <!-- Colonne de gauche : Formulaire & Carte -->
    <section class="left-column">
      
      <div class="card-panel">
        <h2 class="card-title">📝 Publier un signalement</h2>
        <form id="report-form">
          <div class="form-group">
            <label for="product-name">Produit</label>
            <input type="text" id="product-name" class="form-control" placeholder="Ex: Lait, Eau minérale, Sucre..." required />
          </div>

          <div class="form-group">
            <label for="status">État du stock</label>
            <select id="status" class="form-control" required>
              <option value="Disponible">🟢 En stock</option>
              <option value="Rupture">🔴 En rupture</option>
            </select>
          </div>

          <div class="form-group">
            <label for="store-select">Magasin / Commerce</label>
            <select id="store-select" class="form-control">
              <option value="">Recherche des commerces proches...</option>
            </select>
          </div>

          <button type="submit" class="btn-submit">Publier le signalement</button>
        </form>
      </div>

      <div class="map-wrapper">
        <button class="btn-locate" onclick="recenterMap()">🎯 Ma position</button>
        <div id="map"></div>
      </div>

    </section>

    <!-- Colonne de droite : Flux en direct -->
    <section class="right-column">
      <div class="card-panel">
        <div class="feed-header">
          <h2 class="card-title" style="margin-bottom:0;">Derniers signalements</h2>
          <span class="live-badge">
            <span class="live-pulse"></span> EN DIRECT
          </span>
        </div>
        
        <div id="reports-feed" class="feed-list">
          <!-- Les signalements s'affichent ici -->
        </div>
      </div>
    </section>

  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Supabase JS -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- Application JS -->
  <script src="app.js"></script>
</body>
</html>
