<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win Nal9a - Cartographie Intelligente</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="logo-area">
            <h1>📍 Win Nal9a</h1>
            <span class="subtitle">Cartographie intelligente des stocks</span>
        </div>
        <div class="kpi-banner">
            <div class="kpi-item">
                <span class="kpi-dot"></span>
                <span id="connected-count">2904</span> en ligne
            </div>
            <div class="kpi-item">
                📊 Top lieu : <strong id="top-location">Ariana</strong>
            </div>
        </div>
    </header>

    <div class="main-container">
        <button id="toggle-sidebar" class="mobile-toggle-btn">☰ Filtrer & Signaler</button>

        <aside id="sidebar" class="sidebar">
            <div class="sidebar-section">
                <h3>🔍 Filtrer & Proximité</h3>
                <select id="product-filter" class="form-control">
                    <option value="all">Tous les produits et carburants</option>
                    <option value="Essence Sans Plomb">Essence Sans Plomb</option>
                    <option value="Eau minérale">Eau minérale</option>
                </select>
                <div class="filter-actions">
                    <button class="btn btn-primary active" data-filter="all">Tout</button>
                    <button class="btn btn-success" data-filter="stock">Stock</button>
                    <button class="btn btn-danger" data-filter="rupture">Rupture</button>
                </div>
                <button id="btn-gps" class="btn btn-gps">📍 Ma position GPS</button>
            </div>

            <div class="sidebar-section">
                <h3>⚡ Publier un signalement</h3>
                <form id="signal-form">
                    <div class="form-group">
                        <label>Produit / Carburant</label>
                        <select id="signal-product" class="form-control" required>
                            <option value="">-- Sélectionnez --</option>
                            <option value="Essence Sans Plomb">Essence Sans Plomb</option>
                            <option value="Eau minérale">Eau minérale</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Statut</label>
                        <select id="signal-status" class="form-control" required>
                            <option value="En stock">🟢 En stock</option>
                            <option value="En rupture">🔴 En rupture</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Lieu / Station</label>
                        <input type="text" id="signal-location" class="form-control" placeholder="Ex: Station Agil, Ennasr" required>
                    </div>
                    <button type="submit" class="btn btn-submit">Diffuser l'alerte</button>
                </form>
            </div>

            <div class="sidebar-section">
                <h3>📋 Flux des alertes en direct</h3>
                <div id="alerts-stream" class="alerts-stream"></div>
            </div>
        </aside>

        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
