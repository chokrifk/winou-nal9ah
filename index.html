<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disponibilité en Direct</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Styles CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <h1>🛒 Disponibilité en Direct</h1>
    <p>Signalez et trouvez les produits & carburants disponibles à proximité</p>
    <div class="powered-by">Powered by Choco</div>
  </header>

  <main class="main-container">
    
    <!-- Colonne de gauche : Formulaire & Carte -->
    <section class="left-column">
      
      <div class="card-panel">
        <h2 class="card-title">📝 Publier un signalement</h2>
        <form id="report-form">
          
          <!-- LISTE FIXE DES PRODUITS ET CARBURANTS -->
          <div class="form-group">
            <label for="product-select">Produit / Carburant</label>
            <select id="product-select" class="form-control" onchange="toggleCustomProductInput(this)" required>
              <option value="" disabled selected>-- Sélectionnez un produit --</option>
              <optgroup label="⛽ Carburants">
                <option value="Essence Sans Plomb">⛽ Essence Sans Plomb</option>
                <option value="Gasoil / Diesel">⛽ Gasoil / Diesel</option>
                <option value="Gasoil 50">⛽ Gasoil 50</option>
                <option value="Bouteille de gaz">🔥 Bouteille de gaz</option>
              </optgroup>
              <optgroup label="🛒 Produits alimentaires">
                <option value="Eau minérale">🥤 Eau minérale</option>
                <option value="Lait">🥛 Lait</option>
                <option value="Sucre">🧂 Sucre</option>
                <option value="Farine">🌾 Farine</option>
                <option value="Huile d'olive">🫒 Huile d'olive</option>
                <option value="Huile végétale">🧴 Huile végétale</option>
                <option value="Pâtes / Riz">🍝 Pâtes / Riz</option>
                <option value="Café">☕ Café</option>
              </optgroup>
              <optgroup label="Autre">
                <option value="Autre">✏️ Autre (Saisie libre)</option>
              </optgroup>
            </select>
          </div>

          <!-- Champ masqué par défaut pour saisie personnalisée -->
          <div class="form-group" id="custom-product-group" style="display: none;">
            <label for="product-custom">Nom du produit personnalisé</label>
            <input type="text" id="product-custom" class="form-control" placeholder="Entrez le nom..." />
          </div>

          <div class="form-group">
            <label for="status">État du stock</label>
            <select id="status" class="form-control" required>
              <option value="Disponible">🟢 En stock / Disponible</option>
              <option value="Rupture">🔴 En rupture</option>
            </select>
          </div>

          <div class="form-group">
            <label for="store-select">Commerce / Station-Service</label>
            <select id="store-select" class="form-control">
              <option value="">Recherche des lieux proches...</option>
            </select>
          </div>

          <button type="submit" class="btn-submit">Publier le signalement</button>
        </form>
      </div>

      <div class="map-wrapper">
        <button class="btn-locate" onclick="recenterMap()">🎯 Ma position</button>
        <div id="map"></div>
      </div>

    </section>

    <!-- Colonne de droite : Flux en direct -->
    <section class="right-column">
      <div class="card-panel">
        <div class="feed-header">
          <h2 class="card-title" style="margin-bottom:0;">Derniers signalements</h2>
          <span class="live-badge">
            <span class="live-pulse"></span> EN DIRECT
          </span>
        </div>
        
        <div id="reports-feed" class="feed-list">
          <!-- Les signalements s'affichent ici -->
        </div>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <p>Powered by <strong>Choco</strong></p>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Supabase JS -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- Application JS -->
  <script src="app.js"></script>
</body>
</html>
